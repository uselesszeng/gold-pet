$:
  push:
    - name: test
      docker:
        image: python:3.12-slim
      stages:
        - name: install system libs
          script: |
            apt-get update -qq
            apt-get install -y -qq libglib2.0-0 libgl1 libegl1 libfontconfig1 libdbus-1-3 libxkbcommon-x11-0
        - name: install deps
          script: |
            pip install -q --break-system-packages -r requirements.txt -r requirements-dev.txt
        - name: pytest
          script: python -m pytest tests -q

  pull_request:
    - name: test
      docker:
        image: python:3.12-slim
      stages:
        - name: install system libs
          script: |
            apt-get update -qq
            apt-get install -y -qq libglib2.0-0 libgl1 libegl1 libfontconfig1 libdbus-1-3 libxkbcommon-x11-0
        - name: install deps
          script: |
            pip install -q --break-system-packages -r requirements.txt -r requirements-dev.txt
        - name: pytest
          script: python -m pytest tests -q
