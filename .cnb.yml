$:
  push:
    - name: quality
      docker:
        image: python:3.12-slim
      stages:
        - name: install system libs
          script: |
            apt-get update -qq
            apt-get install -y -qq libglib2.0-0 libgl1 libegl1 libfontconfig1 libdbus-1-3 libxkbcommon-x11-0
        - name: install deps
          script: |
            pip install -q --break-system-packages -r requirements.txt -r requirements-dev.txt
        - name: lint
          script: |
            python -m ruff check .
            python -m ruff format --check .
        - name: type check
          script: python -m mypy
        - name: test
          script: python -m pytest tests --cov=gold_pet --cov-report=term-missing

  pull_request:
    - name: quality
      docker:
        image: python:3.12-slim
      stages:
        - name: install system libs
          script: |
            apt-get update -qq
            apt-get install -y -qq libglib2.0-0 libgl1 libegl1 libfontconfig1 libdbus-1-3 libxkbcommon-x11-0
        - name: install deps
          script: |
            pip install -q --break-system-packages -r requirements.txt -r requirements-dev.txt
        - name: lint
          script: |
            python -m ruff check .
            python -m ruff format --check .
        - name: type check
          script: python -m mypy
        - name: test
          script: python -m pytest tests --cov=gold_pet --cov-report=term-missing
