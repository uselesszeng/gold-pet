$:
  push:
    - name: quality
      docker:
        image: python:3.12-slim
      stages:
        - name: install system libs
          script: |
            apt-get update -qq
            apt-get install -y -qq libglib2.0-0 libgl1 libegl1 libfontconfig1 libdbus-1-3 libxkbcommon-x11-0
        - name: install deps
          script: |
            pip install -q --break-system-packages -r requirements.txt -r requirements-dev.txt
        - name: lint
          script: |
            python -m ruff check .
            python -m ruff format --check .
        - name: type check
          script: python -m mypy
        - name: test
          # fail_under 在 pyproject.toml 的 [tool.coverage.report] 中定义（当前 65%）
          script: |
            python -m pytest tests --cov=gold_pet --cov-report=term-missing

  pull_request:
    - name: quality
      docker:
        image: python:3.12-slim
      stages:
        - name: install system libs
          script: |
            apt-get update -qq
            apt-get install -y -qq libglib2.0-0 libgl1 libegl1 libfontconfig1 libdbus-1-3 libxkbcommon-x11-0
        - name: install deps
          script: |
            pip install -q --break-system-packages -r requirements.txt -r requirements-dev.txt
        - name: lint
          script: |
            python -m ruff check .
            python -m ruff format --check .
        - name: type check
          script: python -m mypy
        - name: test
          # fail_under 在 pyproject.toml 的 [tool.coverage.report] 中定义（当前 65%）
          script: |
            python -m pytest tests --cov=gold_pet --cov-report=term-missing

  # 打 tag 时的发布检查。
  #
  # 为什么不在这里自动上传附件？
  #   1. `release/` 已列入 .gitignore（46MB 的 exe 不应进入 git 历史），
  #      流水线的工作区里根本没有这个目录，attachments 插件无从下手；
  #   2. CNB 官方托管节点只有 Linux，无法在此构建 Windows exe。
  # 因此实际发版流程是「本地构建 → 手动上传」（见 README「发版流程」）。
  # 这里只做一件事：确认这个 tag 已经建好 Release，否则提醒开发者补建。
  tag_push:
    - name: check-release
      stages:
        - name: 提示补建 Release
          script: |
            echo "已推送标签：$CNB_BRANCH"
            echo ""
            echo "接下来请在本地执行（两选一）："
            echo "  A. 网页端建 Release 后，用工具上传产物："
            echo "     python tools/cnb_release_upload.py TJ-coding/gold-pet <release_id> \\"
            echo "         release/GoldPet-$CNB_BRANCH-win64.exe --tag $CNB_BRANCH"
            echo "  B. 只建 Release、产物稍后补传（Release 页面支持直接拖拽上传）。"
            echo ""
            echo "详见 README「发版流程」章节。"
