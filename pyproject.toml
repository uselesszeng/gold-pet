[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["build", "dist", ".venv", "mobile"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
files = ["gold_pet/price.py", "gold_pet/config.py", "gold_pet/paths.py", "gold_pet/bubble.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
