[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["build", "dist", ".venv", "mobile"]

# R5-R-02：历史上本仓只跑 `ruff check`（不查排版），代码排版全靠手写习惯，
# 因此 `.cnb.yml` 的 `ruff format --check .` 硬门禁曾长期不通过（38 个文件待重排）。
# 该笔**纯格式提交**已完成（AST 逐文件比对确认零逻辑变化），门禁现已三绿。
# 这里仍然显式钉住 formatter 的目标风格 + requirements-dev.txt 固定 ruff 版本，
# 避免换 ruff 版本后排版结论漂移（0.6.9 与 0.17 的 assert 断行风格即不同）。

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
files = ["gold_pet/price.py", "gold_pet/config.py", "gold_pet/paths.py", "gold_pet/bubble.py"]

[tool.coverage.run]
source = ["gold_pet"]
omit = ["gold_pet/__init__.py"]

[tool.coverage.report]
# 门槛随版本推进：v0.4.1 已达成 72%，门禁设在 65% 留出波动余量
fail_under = 65
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project]
# 许可以仓库根目录 LICENSE 文件为准（MIT + 附加条款：原创署名 / 商用需授权 / 禁止非法）
license = "SEE LICENSE IN LICENSE"
