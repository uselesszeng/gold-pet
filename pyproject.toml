[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["build", "dist", ".venv", "mobile"]

# R5-R-02：本仓的 ruff.format 门禁**当前不通过**（38 个文件需重排，改动前即如此），
# 原因是历史上一直只跑 `ruff check`（不查排版），代码排版依赖手写习惯。
# 由于 .cnb.yml 里 `ruff format --check .` 是硬门禁，这里显式把 formatter 的
# 目标风格钉死在当前配置上，避免换 ruff 版本后门禁结果漂移。
# 残留的 38 个文件待一笔**纯格式提交**统一重排（不动逻辑），见 R5 评审报告。

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
files = ["gold_pet/price.py", "gold_pet/config.py", "gold_pet/paths.py", "gold_pet/bubble.py"]

[tool.coverage.run]
source = ["gold_pet"]
omit = ["gold_pet/__init__.py"]

[tool.coverage.report]
# 门槛随版本推进：v0.4.1 已达成 72%，门禁设在 65% 留出波动余量
fail_under = 65
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project]
# 许可以仓库根目录 LICENSE 文件为准（MIT + 附加条款：原创署名 / 商用需授权 / 禁止非法）
license = "SEE LICENSE IN LICENSE"
